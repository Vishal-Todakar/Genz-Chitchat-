version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    ports:
      - '3001:3001'
    environment:
      - PORT=3001
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:3000
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    ports:
      - '3000:80'
    depends_on:
      - server
    restart: unless-stopped

